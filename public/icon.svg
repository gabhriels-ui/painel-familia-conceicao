<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="38%" r="68%">
      <stop offset="0%" stop-color="#2a1c12" />
      <stop offset="55%" stop-color="#14110f" />
      <stop offset="100%" stop-color="#0d0b09" />
    </radialGradient>
    <linearGradient id="goldBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#eab308" />
      <stop offset="65%" stop-color="#85580f" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
    <linearGradient id="crimsonField" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="55%" stop-color="#5e1010" />
      <stop offset="100%" stop-color="#2a0606" />
    </linearGradient>
    <linearGradient id="ironField" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b313c" />
      <stop offset="50%" stop-color="#171a20" />
      <stop offset="100%" stop-color="#0b0c0f" />
    </linearGradient>
    <linearGradient id="crossGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="45%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>

  <!-- Base Obsidian Steel -->
  <rect width="512" height="512" rx="96" fill="url(#bgGlow)" />

  <!-- Subtle Outer Rim -->
  <rect x="18" y="18" width="476" height="476" rx="82" fill="none" stroke="url(#goldBevel)" stroke-width="5" opacity="0.55" />

  <!-- Heraldic Shield Outer Gold Frame -->
  <path
    d="M256 64 L412 114 V246 C412 346 344 416 256 448 C168 416 100 346 100 246 V114 Z"
    fill="url(#goldBevel)"
  />

  <!-- Inner Wrought-Iron Shield -->
  <path
    d="M256 78 L398 124 V245 C398 336 336 401 256 432 C176 401 114 336 114 245 V124 Z"
    fill="url(#ironField)"
  />

  <!-- Imperial Crimson Center Field -->
  <path
    d="M256 96 L380 136 V243 C380 323 326 382 256 411 C186 382 132 323 132 243 V136 Z"
    fill="url(#crimsonField)"
    stroke="#eab308"
    stroke-opacity="0.42"
    stroke-width="3"
  />

  <!-- Corner Rivets -->
  <circle cx="152" cy="154" r="6" fill="#fde047" opacity="0.8" />
  <circle cx="360" cy="154" r="6" fill="#fde047" opacity="0.8" />
  <circle cx="256" cy="390" r="6" fill="#fde047" opacity="0.8" />

  <!-- Radiant Golden Cross -->
  <path
    d="M238 142 H274 V216 H342 V252 H274 V358 H238 V252 H170 V216 H238 Z"
    fill="url(#crossGold)"
  />
  <path
    d="M244 148 H268 V222 H336 V246 H268 V352 H244 V246 H176 V222 H244 Z"
    fill="none"
    stroke="#ffffff"
    stroke-opacity="0.35"
    stroke-width="2"
  />
</svg>
